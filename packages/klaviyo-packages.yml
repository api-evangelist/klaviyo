  - language: kotlin
    registry: github-releases
    name: klaviyo-android-sdk
    url: https://github.com/klaviyo/klaviyo-android-sdk
    install: 'implementation "com.klaviyo.analytics:analytics:4.4.1"'
    repository: https://github.com/klaviyo/klaviyo-android-sdk
    version: 4.4.1
    published: '2026-06-29'
    official: true
    note: >-
      Mobile SDK (push, in-app messages, geofencing, event + profile tracking).
      No `com.klaviyo` group is published on Maven Central
      (repo1.maven.org/maven2/com/klaviyo/ -> HTTP 404), so no registry metadata
      endpoint could be queried; version and date come from the GitHub release tag.

  - language: swift
