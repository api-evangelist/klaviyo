    registry: npm
    name: klaviyo-api
    url: https://www.npmjs.com/package/klaviyo-api
    install: npm install klaviyo-api
    repository: https://github.com/klaviyo/klaviyo-api-node
    version: 23.0.0
    published: '2026-07-15'
    official: true
    note: TypeScript client for the Klaviyo REST API; generated from klaviyo/openapi.

  - language: python
    registry: pypi
    name: klaviyo-api
    url: https://pypi.org/project/klaviyo-api/
    install: pip install klaviyo-api
    repository: https://github.com/klaviyo/klaviyo-api-python
    version: 24.0.0
    published: '2026-07-15'
    official: true

