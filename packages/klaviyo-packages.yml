generated: '2026-08-13'
method: searched
source: https://developers.klaviyo.com/en/docs/sdk_overview
notes: >-
  Versions and publish dates read from each registry's unauthenticated metadata
  endpoint on 2026-08-13 (registry.npmjs.org, pypi.org/pypi/<pkg>/json,
  rubygems.org/api/v1/gems/<pkg>.json, repo.packagist.org, pub.dev/api/packages,
  api.github.com releases for the mobile SDKs). Klaviyo's server-side SDKs are
  generated from the same OpenAPI at https://github.com/klaviyo/openapi and are
  released in lockstep — node/python/php/ruby all shipped on 2026-07-15, matching
  the 2026-07-15 API revision. Android and Swift are distributed through Maven
  Central / Swift Package Manager respectively; Maven Central has no `com.klaviyo`
  group published (repo1.maven.org/maven2/com/klaviyo/ returns 404), so the Android
  version is read from the GitHub release tag instead and `registry` is recorded as
  `github-releases`.
packages:
