    repository: https://github.com/klaviyo/klaviyo-swift-sdk
    version: 5.3.1
    published: '2026-04-30'
    official: true
    note: >-
      Swift Package Manager resolves from the git tag directly; SPM has no central
      registry metadata endpoint, so version/date come from the GitHub release tag.

