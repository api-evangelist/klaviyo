      type: object
      properties:
        reachable_status:
          type: string
          enum:
          - explicitly_unreachable
        filters:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EffectiveDateFilter'
            - $ref: '#/components/schemas/RecordedDateFilter'
            - $ref: '#/components/schemas/MethodFilter'
            - $ref: '#/components/schemas/FormSubscribeFilter'
      required:
      - reachable_status
      - filters
    GetFlowMessageEncodedResponseCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FlowMessageEncodedResponseObjectResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
      required:
      - data
    GetFlowActionEncodedResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FlowActionEncodedResponseObjectResource'
        links:
          $ref: '#/components/schemas/ObjectLinks'
      required:
      - data
    NoEmailMarketingConsent:
      type: object
      properties:
