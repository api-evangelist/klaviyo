    patch:
      operationId: update_flow
      summary: Update Flow Status
      description: 'Update the status of a flow with the given flow ID, and all actions in that flow.


        *Rate limits*:

        Burst: `3/s`

        Steady: `60/m`


        **Scopes:**

        `flows:write`'
      parameters:
      - name: id
        in: path
        description: 'ID of the Flow to update. Ex: XVTP5Q'
        required: true
        schema:
          description: 'ID of the Flow to update. Ex: XVTP5Q'
          type: string
      - name: revision
        in: header
        description: 'API endpoint revision (format: YYYY-MM-DD[.suffix])'
        required: true
        schema:
          type: string
          default: '2026-04-15'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FlowUpdateQuery'
      responses:
        '200':
          description: Success
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PatchFlowResponse'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
      tags:
      - Flows
      x-klaviyo-pre-release: None
      x-klaviyo-ratelimit:
        burst: 3/s
        steady: 60/m
      x-klaviyo-scopes:
