      operationId: get_flows
      summary: Get Flows
      description: 'Get all flows in an account.


        Returns a maximum of 50 flows per request, which can be paginated with cursor-based pagination.


        *Rate limits*:

        Burst: `3/s`

        Steady: `60/m`


