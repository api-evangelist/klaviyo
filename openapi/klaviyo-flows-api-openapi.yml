          type: boolean
          enum:
          - false
        consent_status:
          oneOf:
          - $ref: '#/components/schemas/NoEmailMarketing'
          - $ref: '#/components/schemas/NoEmailMarketingUnsubscribed'
          - $ref: '#/components/schemas/NoEmailMarketingNeverSubscribed'
          - $ref: '#/components/schemas/NoEmailMarketingSubscribed'
      required:
