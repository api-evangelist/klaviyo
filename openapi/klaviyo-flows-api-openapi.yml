        steady: 60/m
      x-klaviyo-scopes:
      - flows:read
    post:
      operationId: create_flow
      summary: Create Flow
      description: 'Create a new flow using an encoded flow definition.


        New objects within the flow definition, such as actions, will need to use a

        `temporary_id` field for identification. These will be replaced with traditional `id` fields

        after successful creation.


        A successful request will return the new definition to you.


        *Rate limits*:

        Burst: `1/s`

        Steady: `15/m`

        Daily: `100/d`


        **Scopes:**

        `flows:write`'
      parameters:
      - name: additional-fields[flow]
        in: query
        description: 'Request additional fields not included by default in the response. Supported values: ''definition'''
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - definition
        explode: false
      - name: revision
        in: header
        description: 'API endpoint revision (format: YYYY-MM-DD[.suffix])'
        required: true
        schema:
          type: string
          default: '2026-04-15'
      requestBody:
        description: Creates a Flow from parameters
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FlowCreateQuery'
      responses:
        '201':
          description: Success
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PostFlowV2Response'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
      tags:
      - Flows
      x-klaviyo-pre-release: None
      x-klaviyo-ratelimit:
        burst: 1/s
        steady: 15/m
        daily: 100/d
      x-klaviyo-scopes:
      - flows:write
