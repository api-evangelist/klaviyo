  /api/profile-bulk-import-jobs:
    get:
      operationId: get_bulk_import_profiles_jobs
      summary: Get Bulk Import Profiles Jobs
      description: 'Get all bulk profile import jobs.


        Returns a maximum of 100 jobs per request.


        *Rate limits*:

        Burst: `10/s`

        Steady: `150/m`


        **Scopes:**

        `lists:read`

        `profiles:read`'
      parameters:
      - name: fields[profile-bulk-import-job]
        in: query
        description: For more information please visit https://developers.klaviyo.com/en/v2026-04-15/reference/api-overview#sparse-fieldsets
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - completed_at
            - completed_count
            - created_at
            - expires_at
            - failed_count
            - started_at
            - status
            - total_count
        explode: false
      - name: filter
        in: query
        description: 'For more information please visit https://developers.klaviyo.com/en/v2026-04-15/reference/api-overview#filtering<br>Allowed field(s)/operator(s):<br>`status`: `any`, `equals`'
        schema:
          type: string
          example: equals(status,'queued')
      - name: page[cursor]
        in: query
        description: For more information please visit https://developers.klaviyo.com/en/v2026-04-15/reference/api-overview#pagination
        required: false
        schema:
          type: string
      - name: page[size]
        in: query
        description: 'Default: 20. Min: 1. Max: 100.'
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: For more information please visit https://developers.klaviyo.com/en/v2026-04-15/reference/api-overview#sorting
        schema:
          type: string
          enum:
          - created_at
          - -created_at
      - name: revision
        in: header
        description: 'API endpoint revision (format: YYYY-MM-DD[.suffix])'
        required: true
        schema:
          type: string
          default: '2026-04-15'
      responses:
        '200':
          description: Success
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProfileImportJobResponseCollectionCompoundDocument'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
      tags:
      - Profiles
      x-klaviyo-operation-aliases:
      - get_bulk_profile_import_jobs
      - get_profile_bulk_import_jobs
      x-klaviyo-pre-release: None
      x-klaviyo-ratelimit:
        burst: 10/s
        steady: 150/m
      x-klaviyo-scopes:
      - lists:read
      - profiles:read
      x-klaviyo-subtag: Bulk Import Profiles
    post:
      operationId: bulk_import_profiles
      summary: Bulk Import Profiles
      description: 'Create a bulk profile import job to create or update a batch of profiles.


        Accepts up to 10,000 profiles per request. The maximum allowed payload size is 5MB. The maximum allowed payload size per-profile is 100KB.


        To learn more, see our Bulk Profile Import API guide.


        *Rate limits*:

        Burst: `10/s`

        Steady: `150/m`


        **Scopes:**

        `lists:write`

        `profiles:write`'
      parameters:
      - name: revision
        in: header
        description: 'API endpoint revision (format: YYYY-MM-DD[.suffix])'
        required: true
        schema:
          type: string
          default: '2026-04-15'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ProfileImportJobCreateQuery'
      responses:
        '202':
