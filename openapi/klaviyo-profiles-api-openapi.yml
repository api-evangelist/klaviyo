  /api/profile-subscription-bulk-create-jobs:
    post:
      operationId: bulk_subscribe_profiles
      summary: Bulk Subscribe Profiles
      description: 'Subscribe one or more profiles to email marketing, SMS marketing, WhatsApp, or push. If the provided list has double opt-in enabled, profiles will receive a message requiring their confirmation before subscribing. Otherwise, profiles will be immediately subscribed without receiving a confirmation message.

        Learn more about consent in this guide.


        If a list is not provided, the opt-in process used will be determined by the account-level default opt-in setting.


        To add someone to a list without changing their subscription status, use Add Profile to List.


        This API will remove any `UNSUBSCRIBE`, `SPAM_REPORT` or `USER_SUPPRESSED` suppressions from the provided profiles. Learn more about suppressed profiles.


        Maximum number of profiles can be submitted for subscription: 1000


        This endpoint now supports a `historical_import` flag. If this flag is set `true`, profiles being subscribed will bypass double opt-in emails and be subscribed immediately. They will also bypass any associated "Added to list" flows. This is useful for importing historical data where you have already collected consent. If `historical_import` is set to true, the `consented_at` field is required and must be in the past.


        Push tokens provided in `push_tokens` will be registered for each profile as long as push subscriptions are consented to.


        *Rate limits*:

        Burst: `75/s`

        Steady: `750/m`


        **Scopes:**

        `lists:write`

        `profiles:write`

        `subscriptions:write`'
      parameters:
      - name: revision
        in: header
        description: 'API endpoint revision (format: YYYY-MM-DD[.suffix])'
        required: true
        schema:
          type: string
          default: '2026-04-15'
      requestBody:
        description: 'Subscribes one or more profiles to marketing, with support for push channel and push tokens.

          All profiles will be added to the provided list. Either email or phone number is required.

          Both may be specified to subscribe to both channels. If a profile cannot be found matching

          the given identifier(s), a new profile will be created and then subscribed.'
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateJobCreateQuery'
      responses:
        '202':
          description: Success
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
      tags:
      - Profiles
      x-klaviyo-operation-aliases:
      - subscribe_profiles
      - create_profile_subscription_bulk_create_job
      x-klaviyo-pre-release: None
      x-klaviyo-ratelimit:
        burst: 75/s
        steady: 750/m
      x-klaviyo-scopes:
      - lists:write
      - profiles:write
      - subscriptions:write
      x-klaviyo-subtag: Consent
  /api/profile-subscription-bulk-delete-jobs:
    post:
      operationId: bulk_unsubscribe_profiles
      summary: Bulk Unsubscribe Profiles
      description: '> 🚧

        >

        > Profiles not in the specified list will be globally unsubscribed. Always verify profile list membership before calling this endpoint to avoid unintended global unsubscribes.


        Unsubscribe one or more profiles from email marketing, SMS marketing, push marketing, or a combination. Learn more about consent in this guide.


        Push tokens provided in `subscriptions.push.tokens` will be removed for the specified profiles.


        To remove someone from a list without changing their subscription status, use Remove Profiles from List.


