  /api/segments/{id}/flow-triggers:
    get:
      operationId: get_flows_triggered_by_segment
      summary: Get Flows Triggered by Segment
      description: 'Get all flows where the given segment ID is being used as the trigger.


        *Rate limits*:

        Burst: `3/s`

        Steady: `60/m`


        **Scopes:**

        `flows:read`

        `segments:read`'
      parameters:
      - name: id
        in: path
