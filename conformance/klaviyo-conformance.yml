standards:
  - id: openapi-3.0
    conforms: true
    evidence: 'All 23 documents in openapi/ declare openapi: 3.0.2.'
  - id: json-api
    conforms: partial
    evidence: >-
      Every 2xx response is application/vnd.api+json; resources carry type/id/attributes/
      relationships; /relationships/ sub-resources exist for every association; JSON:API
      filtering, sparse fieldsets (fields[TYPE]) and includes are implemented. Klaviyo
      describes the API as following JSON:API conventions but makes no formal 1.x
      conformance claim, and the error envelope is JSON:API-shaped rather than certified.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use the JSON:API `errors[]` envelope with application/vnd.api+json, not
      application/problem+json. See errors/klaviyo-problem-types.yml.
  - id: oauth2
    conforms: true
    evidence: >-
      Authorization Code grant at https://www.klaviyo.com/oauth/authorize, token at
      https://a.klaviyo.com/oauth/token, revocation at /oauth/revoke, 46 published
      scopes. See scopes/klaviyo-scopes.yml.
  - id: rfc7636-pkce
    conforms: true
    evidence: >-
      PKCE is MANDATORY for both public and confidential clients; code_challenge_method
      must be S256 (Klaviyo OAuth docs).
