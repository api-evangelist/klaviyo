source: https://developers.klaviyo.com/en/docs/klaviyo_mcp_server

server:
  name: Klaviyo MCP Server
  vendor: Klaviyo
  first_party: true
  maturity: beta
  documentation: https://developers.klaviyo.com/en/docs/klaviyo_mcp_server

deployment:
  mode: both
  endpoint: https://mcp.klaviyo.com/mcp
  install: uvx klaviyo-mcp-server@latest
  package: https://pypi.org/project/klaviyo-mcp-server/
  auth: oauth
  verified: probed

deployment_detail:
  remote:
    endpoint: https://mcp.klaviyo.com/mcp
    transport: streamable-http
    auth: oauth
    auth_evidence: >-
      POST tools/list to https://mcp.klaviyo.com/mcp returned HTTP 401 with
      `WWW-Authenticate: Bearer realm="OAuth", error="invalid_token"` on 2026-08-13.
      The endpoint is live and OAuth-protected.
    dynamic_client_registration: true
    authorization_server: https://mcp.klaviyo.com
    authorization_endpoint: https://mcp.klaviyo.com/authorize
    token_endpoint: https://mcp.klaviyo.com/token
    registration_endpoint: https://mcp.klaviyo.com/register
    pkce: [S256, plain]
    protected_resource_metadata: well-known/klaviyo-mcp-oauth-protected-resource.json
    authorization_server_metadata: well-known/klaviyo-mcp-oauth-authorization-server.json
    query_parameters:
      - name: read-only
        value: 'true'
        effect: Disables all write operations on the session.
      - name: core-tools-only
        value: 'true'
        effect: Restricts the session to roughly 40 core tools instead of the full set.
      - name: toolsets
        value: 'profiles:read,campaigns:read'
        effect: >-
          Scope-shaped allow-list that filters the exposed tools to the named
          toolsets. Uses the same <resource>:<read|write> vocabulary as the OAuth
          scopes in scopes/klaviyo-scopes.yml.
  local_stdio:
    install: uvx klaviyo-mcp-server@latest
    package: https://pypi.org/project/klaviyo-mcp-server/
    package_version: 0.4.1
    package_published: '2026-03-05'
    prerequisite: uv (https://docs.astral.sh/uv/getting-started/installation/)
    auth: api-key
    auth_detail: >-
      Private API key supplied as the PRIVATE_API_KEY environment variable; the
      READ_ONLY env var toggles write access. This is a DIFFERENT auth model from the
      remote endpoint, which uses OAuth.
    client_config: |
      {
        "mcpServers": {
          "klaviyo": {
            "command": "uvx",
            "args": ["klaviyo-mcp-server@latest"],
            "env": {
              "PRIVATE_API_KEY": "YOUR_API_KEY",
              "READ_ONLY": "false"
            }
          }
        }
      }
    required_key_scopes:
      accounts: read
      campaigns: full
      catalogs: read
      events: full
      flows: read
      images: full
      lists: read
      metrics: read
      profiles: full
      tags: read
      templates: full

tools_introspection:
  attempted: '2026-08-13'
  method: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept: application/json, text/event-stream'
  result: gated
  http_status: 401
  detail: >-
    The live tool set with real inputSchema requires an authenticated OAuth session.
    The tools[] below are the tool NAMES AND DESCRIPTIONS Klaviyo publishes verbatim in
    the klaviyo-mcp-server package README (PyPI, v0.4.1) for the LOCAL stdio server.
    Input schemas are NOT recorded because they were not observable — see
    mcp/klaviyo-tool-crosswalk.yml, where each tool is bound to the OpenAPI operation
    that carries its real parameter contract.
  surface_divergence: >-
    IMPORTANT — the remote and local servers do not expose the same tool set. Klaviyo's
    docs describe the REMOTE server as exposing "over 200 tools" (with core-tools-only
    trimming to ~40), while the local stdio package documents the 28 tools listed below.
    Only the 28 are enumerated here because only they are published as a list; the
    remote catalogue is not published anywhere anonymous and would have to be
    introspected with a token.

