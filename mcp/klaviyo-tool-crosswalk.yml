mcp_only: []
mcp_only_note: >-
  No MCP-only tools. Every tool in the published local-server set resolves to at least
  one real public REST operation — Klaviyo's MCP server is a straight projection of its
  OpenAPI, not a composite layer. NOTE: this holds for the 28 documented LOCAL tools.
  Klaviyo's docs say the REMOTE endpoint exposes "over 200 tools"; that catalogue is not
  published anonymously and could not be introspected (401), so it is not crosswalked.

