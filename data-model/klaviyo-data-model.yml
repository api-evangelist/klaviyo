conventions:
  id_type: string
  id_format: Mixed. Most Klaviyo resources use an opaque alphanumeric ID (e.g. profiles use a 26-character ULID-like string);
    jobs and some newer resources use UUIDs. Klaviyo does NOT use typed id-prefixes (no cus_/inv_ style), so an ID is not
    self-describing — the `type` member of the JSON:API resource object is what identifies the entity.
  resource_envelope: 'data: {type, id, attributes, relationships, links}'
  type_member: Present on every resource object and required on every write body.
