spine: profile is the hub. Events attach to a profile and are classified by a metric; metrics trigger flows; lists and segments
  group profiles and also trigger flows; campaigns and flows carry messages that reference templates and images. Tags cut
  across campaigns, flows, lists and segments. Commerce (catalog, coupons, reviews) attaches to the same profile/event core
  through metrics.
