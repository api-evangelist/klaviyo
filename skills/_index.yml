cross_cutting_rules:
  - Send the `revision` header on every request; it is required and its absence silently falls forward.
  - 'Write bodies are JSON:API — application/vnd.api+json, with a data object carrying type and attributes.'
  - Pagination is cursor-based; follow links.next, never compute offsets.
  - Honour Retry-After on 429; the RateLimit-* triplet is replaced by Retry-After on exhaustion.
  - 'The include and additional-fields query parameters carry a stricter, globally enforced rate limit.'
  - Idempotency exists only on event creation, via the body field unique_id. There is no Idempotency-Key header.
  - Long-running work returns 202 with a job resource; poll it, and read its errors before declaring success.
